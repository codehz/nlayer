name: targets

# Gallery and the small press/type/scroll app on web, iOS, and Android.
# The runner needs Xcode, a bootable iPhone simulator, an Android emulator
# or device on `adb`, and a Chromium (`NLAYER_BROWSER` if it is not Brave,
# Chrome, or Edge).
on:
  push:
  pull_request:

jobs:
  test-android:
    name: Android tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Install Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: cargo test -p nlayer-cli --test targets -- --test-threads=1 emulator

  test-ios:
    name: iOS tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios

      - name: Install Rust targets
        run: rustup target add aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-ios

      - name: Boot iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"];
          print(next(d["udid"] for runtimes in devices.values() for d in runtimes if "iPhone" in d["name"] and d["isAvailable"]))')"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run iOS tests
        run: cargo test -p nlayer-cli --test targets -- --test-threads=1 simulator

  test-web:
    name: Web tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        id: setup-chrome

      - name: Run Web tests
        env:
          NLAYER_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: cargo test -p nlayer-cli --test targets -- --test-threads=1 browser
