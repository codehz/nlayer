[package]
name = "nlayer-js"
description = "QuickJS host: the JSX runtime, the reactive graph and the platform API a TSX app runs on."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nlayer-core.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
rquickjs.workspace = true
url.workspace = true
base64 = "0.22"
getrandom = "0.3"


# Shipped bindings cover the desktop hosts and wasm, not iOS or Android.
# Bindgen generates them (nsh does this for every native target).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }
[dev-dependencies]
rquickjs.workspace = true
base64 = "0.22"
getrandom = "0.3"
