<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nlayer</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #8a8a8e;
    padding: 24px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status">Loading…</div>
<script type="module">
  // Serves `nlayer.wasm` (this crate, wasm32), `nlayer.js`, `boot.js`,
  // `base.css` and the app's `bundle.js` from one directory. `asset:/`
  // images resolve next to the page.
  import { startPage } from "./boot.js";

  const status = document.getElementById("status");
  const root = document.getElementById("app");
  try {
    const [wasm, bundle, baseCSS] = await Promise.all([
      fetch("./nlayer.wasm").then((response) => {
        if (!response.ok) throw new Error("no nlayer.wasm");
        return response.arrayBuffer();
      }),
      fetch("./bundle.js").then((response) => {
        if (!response.ok) throw new Error("no bundle.js");
        return response.text();
      }),
      fetch("./base.css").then((response) => {
        if (!response.ok) throw new Error("no base.css");
        return response.text();
      }),
    ]);
    status.style.display = "none";
    await startPage(root, {
      wasm,
      bundle,
      baseCSS,
      assetBase: "./",
      onError(message) {
        status.style.display = "";
        status.textContent = message;
      },
    });
  } catch (error) {
    status.textContent = String(error.message ?? error);
  }
</script>
</body>
</html>
