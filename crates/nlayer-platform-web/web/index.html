<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>nlayer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font:
          13px -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #8a8a8e;
        padding: 24px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Loading…</div>
    <script type="module">
      // Serves `nlayer.wasm` (this crate, wasm32), `nlayer.js`, `boot.js`,
      // `base.css` and the app's `bundle.js` from one directory. `asset:/`
      // images resolve next to the page.
      import { startPage } from "./boot.js";

      const status = document.getElementById("status");
      const root = document.getElementById("app");
      try {
        const wasm = await load("./nlayer.wasm", (response) => response.arrayBuffer());
        const bundle = await load("./bundle.js", (response) => response.text());
        const baseCSS = await load("./base.css", (response) => response.text());
        status.style.display = "none";
        const q = new URLSearchParams(location.search);
        const pin = q.has("pin")
          ? {
              width: Number(q.get("w")),
              height: Number(q.get("h")),
              safeArea: {
                top: Number(q.get("sat") || 0),
                right: Number(q.get("sar") || 0),
                bottom: Number(q.get("sab") || 0),
                left: Number(q.get("sal") || 0),
              },
              keyboard: Number(q.get("kb") || 0),
            }
          : null;
        await startPage(root, {
          wasm,
          bundle,
          baseCSS,
          assetBase: "./",
          pin,
          onError(message) {
            status.style.display = "";
            status.textContent = message;
          },
        });
      } catch (error) {
        const message = String(error && error.message ? error.message : error);
        globalThis.__nlayerFailed = message;
        status.textContent = message;
      }

      async function load(path, read) {
        let response;
        try {
          response = await fetch(path);
        } catch (error) {
          throw new Error(`${path}: ${error && error.message ? error.message : error}`);
        }
        if (!response.ok) throw new Error(`${path}: ${response.status}`);
        return read(response);
      }
    </script>
  </body>
</html>
