[package]
name = "nlayer-platform-web"
description = "Web host: the page's engine and the mount JSON it applies to the DOM."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

[features]
default = ["js"]
# QuickJS inside the wasm module. The published page does not use this.
js = ["nlayer-engine/js"]
# The page evaluates the app. The wasm build uses this instead of `js`.
browser = ["nlayer-engine/browser"]

[dependencies]
nlayer-core.workspace = true
nlayer-engine = { workspace = true, default-features = false }
rustc-hash.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
nlayer-bundler.workspace = true
nlayer-core.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
