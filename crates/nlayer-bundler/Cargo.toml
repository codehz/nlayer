[package]
name = "nlayer-bundler"
description = "The app's TSX compiler: TypeScript removed and JSX lowered to the runtime's calls, in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gen-types"
path = "src/bin/gen-types.rs"

[lints]
workspace = true

[dependencies]
nlayer-core.workspace = true
nlayer-js.workspace = true
oxc = { version = "=0.153.0", features = ["transformer", "codegen", "semantic", "ast_visit"] }
oxc_sourcemap = "9"
log.workspace = true
serde_json.workspace = true
anyhow = "1"
imagesize = "0.15"
dunce = "1"
rolldown = "=1.2.13"
rolldown_common = "=1.2.13"
rolldown_error = "=1.2.13"
tokio = { version = "1", default-features = false }

[dev-dependencies]
nlayer-core.workspace = true
nlayer-js.workspace = true
