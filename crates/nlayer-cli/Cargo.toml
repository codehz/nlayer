[package]
name = "nlayer-cli"
description = "The nlayer command line: create, build, test and run a TSX app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nlayer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
nlayer-bundler.workspace = true
nlayer-engine.workspace = true
nlayer-testing.workspace = true
clap = { version = "4", features = ["derive"] }
log.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
plist = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
