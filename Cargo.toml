[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"

[workspace.dependencies]
nlayer-core = { version = "0.1.0", path = "crates/nlayer-core" }
log = "0.4"
ordered-float = { version = "5", default-features = false }
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
unicode-linebreak = "0.1.5"
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size"] }
