[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "deny"
private_interfaces = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(getrandom_backend, values("custom"))'] }

[workspace.dependencies]
nlayer-core = { version = "0.1.0", path = "crates/nlayer-core" }
nlayer-js = { version = "0.1.0", path = "crates/nlayer-js" }
nlayer-engine = { version = "0.1.0", path = "crates/nlayer-engine" }
nlayer-bundler = { version = "0.1.0", path = "crates/nlayer-bundler" }
nlayer-platform-web = { version = "0.1.0", path = "crates/nlayer-platform-web" }
nlayer-testing = { version = "0.1.0", path = "crates/nlayer-testing" }
crossbeam-channel = "0.5"
log = "0.4"
ordered-float = { version = "5", default-features = false }
rustc-hash = "2.1"
# Same fork nsh uses: the QuickJS-NG VM with bindings the host reaches
# directly (module loaders, class callbacks, GC marks).
rquickjs = { package = "quickjs-jit", version = "=0.14.1", default-features = false, features = ["std", "futures", "loader", "macro"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
thiserror = "2"
unicode-linebreak = "0.1.5"
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "content_size"] }
